name: Position pull
# POSDEF-2026-10-28. Owner: "focus on what position the other team allows to score the first basket vs them the most".
# ESPN starters + listed positions, 2016-26 -> soccer-data:nba/pos/espn_pos.jsonl.gz
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Pull
        run: node nba/research/pos/br_pos.js 2>&1 | tail -40; wc -l br_pos.psv; head -5 br_pos.psv
      - name: Save
        if: always()
        run: |
          for i in 1 2 3; do rm -rf d; git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d
            mkdir -p d/nba/pos && cp br_pos.psv d/nba/pos/br_pos.psv && (cd d && git config user.email a@b.c && git config user.name pos && git add nba/pos && git commit -qm "ESPN positions" && git push -q) && break; sleep 7; done
