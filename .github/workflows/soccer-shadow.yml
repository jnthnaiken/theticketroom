name: Soccer Scorer Shadow

# SCORERSHADOW-2026-09-17. Runs the layered scorer model (soccer/history/shadow.py) BESIDE the live
# soccer board. It writes soccer/shadow/<date>.json for the newest slate (once, before kickoff) and
# grades every settled night into soccer/shadow/ledger.json. It NEVER touches the board, the draft,
# index.html or soccer_D.json, and soccer/shadow/ is not in deploy-pages.yml's paths.
#
# History: the multi-season base lives on the `soccer-data` branch (soccer-history.yml). Each run
# refreshes only the current understat season on top of it, so tonight's numbers see last weekend.

on:
  # 🚨 SHADOWDISPATCH-2026-10-11. THE CRON BELOW DID NOT FIRE ON 10-10 AND DID NOT FIRE ON 10-11.
  # Both days the slate was committed, the board built, and the scorer model was simply absent --
  # which under SCOREPROB silently makes every pscore the book's implied probability alone (see
  # SHADOWGUARD-2026-10-11 in soccer_mock.py, which is what now makes that visible). Both were
  # caught only because somebody went looking for the file.
  #
  # This is DISPATCHFALLBACK-2026-08-27 again, same repo, same symptom, same remedy: stop waiting
  # for a schedule that is not being picked up and listen for the dispatches that DEMONSTRABLY
  # arrive. Measured on soccer-build.yml's own run list at 06:2xZ on 2026-10-11 -- `build-tick`,
  # `tick` and `build-board` were all landing in that window, so the chain covers the morning this
  # workflow actually needs, not just the evening its sibling's comment describes.
  #
  # ⚠️ `build-tick` IS DELIBERATELY NOT IN THIS LIST, and soccer-build.yml's is not a template to
  # copy wholesale. ticker.yml fans `build-tick` every five minutes; this job is not a 20-second
  # no-op like the board build -- it pip-installs numpy and pandas and, when there IS something to
  # do, fetches twelve seasons of history. Subscribing to the five-minute fan would be ~290 runs a
  # day to catch one file. `build-board` is the external cron and `tick` is posted once per
  # build-board by pull-slate.yml, which is several chances an hour: enough to beat a 10:30Z
  # kickoff, cheap enough to leave on.
  #
  # ⚠️ AND THE PYTHON SETUP STAYS UNGATED. Gating it on `need` looks obviously right and is wrong:
  # "Grade settled nights" below runs on EVERY pass and needs the interpreter, so conditioning the
  # setup on "is there a slate to shadow" would redden every no-op run. Caught before shipping by
  # reading the steps the gate did not cover, not by the gate itself.
  repository_dispatch:
    types: [tick, build-board, build-soccer]
  schedule:
    # 10:00, 13:00 and 16:00 ET. A slate is usually committed the night before; the later passes
    # catch a slate committed in the morning. --latest is a no-op once the slate is shadowed.
    - cron: '10 5-22 * * *'   # SCOREPROB-2026-10-10: hourly from 05:10Z so the model is in before the first build (was 14,17,20 -- after the noon kickoffs)
  workflow_dispatch:
    inputs:
      dates:
        description: "Space-separated slate dates to (re)shadow, e.g. 2026-09-17. Blank = newest unshadowed."
        default: ""

permissions:
  contents: write

concurrency:
  group: soccer-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # SHADOWDISPATCH-2026-10-11: the gate runs FIRST so a no-op pass costs a checkout and an
      # echo. It needs nothing but the working tree. Everything expensive below is conditioned
      # on its output.
      - name: Anything to shadow?
        id: need
        run: |
          cd soccer
          DATES="${{ inputs.dates }}"
          if [ -z "$DATES" ]; then
            LATEST=$(ls -1d slates/*/ | sed 's#slates/##;s#/##' | sort | tail -1)
            [ -f "shadow/$LATEST.json" ] || DATES="$LATEST"
          fi
          echo "dates=$DATES" >> $GITHUB_OUTPUT
          echo "to shadow: '${DATES}'"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas

      - name: History base + current-season refresh
        if: steps.need.outputs.dates != ''
        # USDOWN-2026-11-07. Owner: "I'm getting 25+ emails/day about soccer runs failing ... please make it stop".
        # Since 11-06 ~22:30Z understat answers EVERY url (pages and /getLeagueData alike) with the same 26.7 KB
        # error page, so fetch_history.py got 0 rows, exited 1, and this job went red on every tick (59 runs).
        # Now: a refresh that comes back empty is a WARNING, not a failure. The newest good current-season pull is
        # cached on soccer-data (history/current/) after every success; when understat is out the model runs on that
        # cache (or on the multi-season base alone if there is no cache yet) and says so in the log.
        run: |
          set -e
          mkdir -p hist cache
          git fetch --depth 1 origin soccer-data
          git show FETCH_HEAD:history/2014-2026-limit0/team_matches.csv.gz   > hist/base_team.csv.gz
          git show FETCH_HEAD:history/2014-2026-limit0/player_matches.csv.gz > hist/base_player.csv.gz
          git show FETCH_HEAD:history/current/team_matches.csv.gz   > cache/team_matches.csv.gz   2>/dev/null || rm -f cache/team_matches.csv.gz
          git show FETCH_HEAD:history/current/player_matches.csv.gz > cache/player_matches.csv.gz 2>/dev/null || rm -f cache/player_matches.csv.gz
          python3 soccer/history/fetch_history.py --out fresh --first 2026 --last 2026 --no-odds || echo "::warning::understat refresh failed -- using the cached current season"
          python3 - <<'PY'
          import os, pandas as pd
          def rows(p):
              try: return pd.read_csv(p) if os.path.exists(p) else None
              except Exception: return None
          ft, fp = rows('fresh/team_matches.csv.gz'), rows('fresh/player_matches.csv.gz')
          src = 'fresh'
          if ft is None or fp is None or len(ft) == 0 or len(fp) == 0:
              ft, fp = rows('cache/team_matches.csv.gz'), rows('cache/player_matches.csv.gz'); src = 'cache'
          bt = pd.read_csv('hist/base_team.csv.gz'); bp = pd.read_csv('hist/base_player.csv.gz')
          if ft is None or fp is None or len(ft) == 0 or len(fp) == 0:
              t, p = bt, bp; src = 'base only'
          else:
              t = pd.concat([bt[bt.season < 2026], ft], ignore_index=True)
              p = pd.concat([bp[bp.season < 2026], fp], ignore_index=True)
          t.to_csv('hist/team_matches.csv.gz', index=False)
          p.to_csv('hist/player_matches.csv.gz', index=False)
          print(f'current season from: {src}; merged', len(t), 'team rows,', len(p), 'player rows; latest', p.date.max())
          if src != 'fresh':
              print(f'::warning::understat unavailable -- shadow model running on the {src} (latest match {p.date.max()})')
          open('hist/SOURCE', 'w').write(src)
          PY
          if [ "$(cat hist/SOURCE)" = "fresh" ]; then
            for i in 1 2 3; do
              rm -rf sd; git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sd || break
              mkdir -p sd/history/current && cp fresh/team_matches.csv.gz fresh/player_matches.csv.gz sd/history/current/
              (cd sd && git config user.email a@b.c && git config user.name shadow-cache && git add history/current \
                && { git diff --cached --quiet || git commit -qm "understat current-season cache $(date -u +%FT%H:%MZ)"; } && git push -q) && break
              sleep 5
            done || true
          fi

      - name: Shadow
        if: steps.need.outputs.dates != ''
        run: python3 soccer/history/shadow.py --history hist --soccer soccer --dates ${{ steps.need.outputs.dates }}

      - name: Grade settled nights
        run: python3 soccer/history/shadow.py --history hist --soccer soccer --grade

      - name: Commit
        run: |
          git config user.name  "kasper-bot"
          git config user.email "kasper-bot@users.noreply.github.com"
          git add soccer/shadow/
          if git diff --staged --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Soccer shadow ${{ steps.need.outputs.dates }} ($(date -u +%H:%MZ))"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && { echo "pushed"; exit 0; }
            sleep 7
          done
          echo "::error::could not push after 5 attempts"; exit 1
