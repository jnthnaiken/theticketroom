name: Threes probe
# THREES-2026-10-25 one-off. Report -> soccer-data:trip/threes.txt
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          set +e; node tools/bp3_probe.js > threes.txt 2>&1; tail -30 threes.txt
          git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d
          git config --global user.email a@b.c; git config --global user.name probe
          mkdir -p d/trip && cp threes.txt d/trip/ && cd d && git add trip/ && git commit -qm probe && git push -q
