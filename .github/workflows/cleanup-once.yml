          hr9_2026-06-21.json
          sched_2026-06-24.json
          reconcile_times.py
          client_sweep.js
          .github/workflows/cleanup-once.yml
          LIST
          echo "listed for deletion: $(wc -l < /tmp/droplist.txt)"
          xargs -a /tmp/droplist.txt git rm --quiet --ignore-unmatch --

      - name: Sanity check -- the load-bearing files must still be here
        run: |
          set -euo pipefail
          for f in D_0615.json build15.py regen15.py calibrate.py grade_night.py index.html \
                   season.json calibration.jsonl slate_auto_2026-08-22.json; do
            test -f "$f" || { echo "!! $f is missing -- refusing to commit"; exit 1; }
          done
          test "$(ls D_2026-*.json 2>/dev/null | wc -l)" -gt 30 || { echo "!! D_ archive looks wrong"; exit 1; }
          test "$(ls cards_2026-*.json 2>/dev/null | wc -l)" -gt 30 || { echo "!! cards archive looks wrong"; exit 1; }
          echo "OK -- $(git diff --cached --name-only | wc -l) files staged for deletion"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "CLEANUP-2026-08-23: drop dead ISO/hr9/sched inputs, stale slate_auto, reconcile_times.py, client_sweep.js" \
                     -m "Audited in claude/kasper-screen-2026-08-23.md. The ISO inputs stopped at 06-28 and build15 no longer reads them (ISOSRC-2026-08-23). Historical slate_auto has no consumer -- build15 reads only today's or the prior day's, so the last three are kept. client_sweep.js aborts all network and therefore certifies nothing (see HANDOFF). This workflow deletes itself in the same commit."
          git push
