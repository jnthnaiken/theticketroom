name: Cleanup Once

# ONE-SHOT, 2026-08-23. Deletes the dead files audited in claude/kasper-screen-2026-08-23.md,
# then DELETES ITSELF in the same commit so it can never run twice.
#
# Explicitly NOT touched, and the reasons, so nobody "tidies" them later:
#   D_0615.json                 LIVE. build15.py writes it, regen15.py reads it. It is the
#                               scorer -> assembler handoff, misnamed after a June 15 slate.
#   cards_/lineups_/odds_/      the corpus. replay_check.js replays archived D_ boards and
#   pitchers_/kasper_extras_/   calibrate.repair() re-derives nights from D_ + kasper_extras.
#   D_<date>.json               Deleting these costs the ability to test anything.
#   slate_auto_2026-08-20..22   build15 reads load_dated('slate_auto') = today or prior day.
#   assemble_tickets.py         not dead, just dangerous -- retiring it is a behaviour change
#                               that needs its own decision, not a cleanup.
#
# Everything here is recoverable from git history.
#
# Run #1 failed with exit 127: the file list was written as shell line-continuations with a
# backslash only on the `git rm` line, so every filename after the first was executed as a
# command. The list is a heredoc now -- no continuations to get wrong.

on:
  workflow_dispatch:

concurrency:
  group: ticket-room          # same group as pull-slate.yml, so this can never race a board build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove dead files
        run: |
          set -euo pipefail
          cat > /tmp/droplist.txt <<'LIST'
          slate_auto_2026-06-16.json
          slate_auto_2026-06-17.json
          slate_auto_2026-06-18.json
          slate_auto_2026-06-19.json
          slate_auto_2026-06-20.json
          slate_auto_2026-06-21.json
          slate_auto_2026-06-22.json
          slate_auto_2026-06-23.json
          slate_auto_2026-06-24.json
          slate_auto_2026-06-25.json
          slate_auto_2026-06-26.json
          slate_auto_2026-06-27.json
          slate_auto_2026-06-28.json
          slate_auto_2026-06-29.json
          slate_auto_2026-06-30.json
          slate_auto_2026-07-01.json
          slate_auto_2026-07-02.json
          slate_auto_2026-07-03.json
          slate_auto_2026-07-04.json
          slate_auto_2026-07-05.json
          slate_auto_2026-07-06.json
          slate_auto_2026-07-07.json
          slate_auto_2026-07-08.json
          slate_auto_2026-07-09.json
          slate_auto_2026-07-10.json
          slate_auto_2026-07-11.json
          slate_auto_2026-07-12.json
          slate_auto_2026-07-17.json
          slate_auto_2026-07-18.json
          slate_auto_2026-07-19.json
          slate_auto_2026-07-20.json
          slate_auto_2026-07-21.json
          slate_auto_2026-07-22.json
          slate_auto_2026-07-23.json
          slate_auto_2026-07-24.json
          slate_auto_2026-07-25.json
          slate_auto_2026-07-26.json
          slate_auto_2026-07-27.json
          slate_auto_2026-07-28.json
          slate_auto_2026-07-31.json
          slate_auto_2026-08-01.json
          slate_auto_2026-08-02.json
          slate_auto_2026-08-03.json
          slate_auto_2026-08-04.json
          slate_auto_2026-08-05.json
          slate_auto_2026-08-06.json
          slate_auto_2026-08-07.json
