name: Soccer Source Probe
# THROWAWAY -- delete after reading the log. v2.
# v1 result: understat 200-but-blocked (18KB challenge page), fbref 403, espn 403.
# Controls (statsapi, open-meteo) passed, so the runner network is fine -- these hosts
# block datacenter IPs. v2 asks: is any of it fixable with an API key (401 = auth-gated,
# fixable) rather than an IP block (403 = not fixable)? Read-only, no secrets.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe v2
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"

          echo "=========== WHAT IS UNDERSTAT ACTUALLY RETURNING? ==========="
          curl -sL -m 25 -A "$UA" "https://understat.com/league/EPL" -o /tmp/u
          echo "bytes: $(stat -c%s /tmp/u 2>/dev/null || echo 0)"
          echo "--- first 400 chars ---"
          head -c 400 /tmp/u; echo; echo "--- title / any block wording ---"
          grep -oiE "<title>[^<]*</title>|cloudflare|just a moment|captcha|access denied|attention required" /tmp/u | sort -u | head -6

          echo
          echo "=========== 401 (fixable with a key) vs 403 (IP block) ==========="
          code () {
            c=$(curl -sL -o /tmp/x -w "%{http_code}" -m 20 -A "$UA" "$2")
            printf "%-26s HTTP %-5s %8s bytes\n" "$1" "$c" "$(stat -c%s /tmp/x 2>/dev/null || echo 0)"
          }
          code football-data-nokey "https://api.football-data.org/v4/competitions/PL/matches"
          code thesportsdb-free    "https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4328"
          code fotmob-matches      "https://www.fotmob.com/api/matches?date=20260829"
          code openligadb-bl1      "https://api.openligadb.de/getmatchdata/bl1/2026"
          code football-json-fix   "https://raw.githubusercontent.com/openfootball/football.json/master/2026-27/en.1.json"

          echo
          echo "=========== SHAPE: whichever fixture source answered ==========="
          for u in "https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4328" \
                   "https://api.openligadb.de/getmatchdata/bl1/2026"; do
            echo "--- $u ---"
            curl -sL -m 20 -A "$UA" "$u" -o /tmp/f
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/f'))
              if isinstance(d,dict):
                  k=list(d.keys())[:6]; print("  dict keys:",k)
                  for kk in k:
                      v=d[kk]
                      if isinstance(v,list) and v:
                          print("  first item keys:",list(v[0].keys())[:12]); break
              elif isinstance(d,list) and d:
                  print("  list len",len(d),"| first item keys:",list(d[0].keys())[:12])
          except Exception as e:
              print("  not json:",str(e)[:80])
          PY
          done
