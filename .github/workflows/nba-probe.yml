name: NBA probe

# NBAPROBE-2026-10-16 -- one-off reachability check for the basketball room's data sources from a
# GitHub runner. v2 (2026-10-17): can the runner read BettingPros first-basket prices itself
# (nba/fb_fetch.js)? Result lands on soccer-data:nba/probe.txt. Delete once the room ships.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        run: |
          set +e
          node nba/fb_fetch.js 2026-04-10 /tmp/fb0410.psv > probe.txt 2>&1
          node nba/fb_fetch.js 2026-10-20 /tmp/fb1020.psv >> probe.txt 2>&1
          wc -l /tmp/fb0410.psv /tmp/fb1020.psv >> probe.txt 2>&1
          head -3 /tmp/fb0410.psv >> probe.txt 2>&1
          cat probe.txt
      - name: Save
        run: |
          git config --global user.email "actions@github.com"; git config --global user.name "nba-probe"
          git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d
          mkdir -p d/nba && cp probe.txt d/nba/probe.txt && cd d && git add nba/probe.txt && git commit -qm "NBA probe $(date -u +%FT%TZ)" && git push -q
