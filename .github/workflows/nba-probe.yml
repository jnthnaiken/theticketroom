name: NBA probe

# NBAPROBE-2026-10-16 -- one-off reachability check for the basketball room's data sources from a
# GitHub runner: the NBA CDN (schedule, scoreboard, box score, play-by-play) and BettingPros.
# Writes nothing to main; the result lands on soccer-data:nba/probe.txt. Delete once the room ships.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for u in \
            https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json \
            https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json \
            https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022500001.json \
            https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0022500001.json \
            "https://api.bettingpros.com/v3/events?sport=NBA&date=2026-10-21" \
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261021" \
            "https://stats.nba.com/stats/scoreboardv2?GameDate=2026-10-21&LeagueID=00&DayOffset=0" ; do
            code=$(curl -sS -m 25 -A "$UA" -H 'Referer: https://www.nba.com/' -o /tmp/b -w '%{http_code}' "$u"); echo "$code $(wc -c </tmp/b) $u" | tee -a probe.txt
          done
          head -c 300 /tmp/b >> probe.txt
      - name: Save
        run: |
          git config --global user.email "actions@github.com"; git config --global user.name "nba-probe"
          git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d
          mkdir -p d/nba && cp probe.txt d/nba/probe.txt && cd d && git add nba/probe.txt && git commit -qm "NBA probe $(date -u +%FT%TZ)" && git push -q
