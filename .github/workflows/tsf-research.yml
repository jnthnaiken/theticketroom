name: TSF research
# TSF-2026-11-11: pull BettingPros "team to score first" (market 145) history -> soccer-data:nba/tsf/
on: { workflow_dispatch: { inputs: { start: { default: '2020-12-22' }, end: { default: '2026-11-10' } } } }
permissions: { contents: write }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node nba/research/tsf/pull_bp145.js ${{ inputs.start }} ${{ inputs.end }} tsf_odds.psv > pull.log 2>&1; tail -5 pull.log; head -c 2500 pull.log; wc -l tsf_odds.psv
      - if: always()
        run: |
          gzip -c tsf_odds.psv > tsf_odds.psv.gz || true
          for i in 1 2 3; do rm -rf d; git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d
            mkdir -p d/nba/tsf && cp tsf_odds.psv.gz pull.log d/nba/tsf/ && (cd d && git config user.email a@b.c && git config user.name tsf && git add nba/tsf && git commit -qm "TSF odds history" && git push -q) && break; sleep 7; done
