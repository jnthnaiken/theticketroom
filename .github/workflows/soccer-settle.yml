name: Settle Soccer Night

# Folds finished soccer boards into soccer/soccer_season.json.
#
# WHY THIS EXISTS. The published soccer board settles itself in the BROWSER: soccer_live.js runs
# every three minutes and index.html grades tonight live off D.tickets. All of that is per-tab and
# dies with the tab. Nothing wrote the night into the ledger, which is how 2026-08-25 was still
# missing from soccer_season.json a day later while the board itself had been showing its own
# result correctly the whole time. Tomorrow's board reads that file for its carried figure, so a
# night that never folds is a night the season silently forgets.
#
# ============================================================================================
# CATCHUP-2026-08-27 -- THIS NOW WORKS THE WAY THE BASEBALL LEDGER DOES.
# ============================================================================================
# The first cut settled ONE board: whatever was in soccer/soccer_D.json right now. That file is
# overwritten by the next day's build, so a night that failed to settle before then was gone --
# not "late", GONE, with no file left to grade. That is precisely how 2026-08-25 was lost, and
# it had to be reconstructed by hand from a captured fixture file.
#
# grade_night.py has never had that problem, because of two properties this workflow now copies:
#
#   1. EVERY SLATE IS ARCHIVED UNDER ITS OWN DATE. Baseball commits D_<date>.json every build and
#      grades THAT, not a rolling file. Soccer now commits soccer/boards/<date>.json when a board
#      is published, and this workflow settles those. soccer_D.json stays as the current board.
#
#   2. IT CATCHES UP. grade_night "finds the last graded night and folds every fully-final night
#      SINCE THEN". So a run that never happened, a feed that was down, a match that went to
#      extra time past the last cron -- all self-heal on the next pass. This loop walks EVERY
#      archived board whose date is not already in `graded_nights`, oldest first, and settles
#      each one independently. A night that could not settle yesterday settles today.
#
# The per-night guards are unchanged and still do the real work:
#   * already in graded_nights -> skip. fold() is idempotent, but re-settling rewrites the board
#     file every hour and churns commits for nothing.
#   * soccer_settle.js -> reads ESPN, writes finals/hr/goalmins into the board file. Exit 0 means
#     EVERY match is final; 20 means come back later; 30 means nothing was learned.
#   * soccer_grade.py -> folds. ONLY on exit 0.
#
# ⚠️ 20 IS NOT A FAILURE. fold() marks the date in `graded_nights` the moment it runs, and
# grade_ticket() returns None for a ticket whose match is still open -- so folding a half-final
# night SILENTLY DROPS every unsettled ticket and can never be redone. Extra time and penalty
# shootouts are normal; that night is simply left for the next pass. This is the one place where
# doing nothing is strictly better than doing something.
#
# ⚠️ THIS WORKFLOW MUST NOT REBUILD soccer/index.html. The board's baked `meta.season` is the
# ledger EXCLUDING tonight -- index.html's liveCats() adds tonight's graded tickets on top of it.
# Rebuild today's board with the post-fold ledger and every ticket counts twice, once carried and
# once live. The next day's build picks the new figure up on its own. Same contract as baseball.

on:
  schedule:
    # Hourly across the window a European slate can finish in, and then some. UCL qualifiers kick
    # at 19:00Z and can run to ~22:00Z with extra time and penalties; a late La Liga game finishes
    # around 21:45Z. The window is deliberately generous rather than tuned: every pass is cheap,
    # the guards make repeats free, and since CATCHUP a late pass can still rescue an older night.
    - cron: '0 19,20,21,22,23,0,1,2,3,4,5,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Fold even if a match never went final (abandoned/postponed). A decision, not a retry."
        required: false
        default: "false"
      date:
        description: "Settle only this date (YYYY-MM-DD). Blank = every unsettled board."
        required: false
        default: ""
      regrade:
        description: "REGRADE-2026-09-04. Take `date` back OUT of the ledger first, then settle and fold it again under today's rules. Requires an explicit date. For a rule change, not a retry."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: soccer-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ------------------------------------------------------------------------------------
      # Which boards are unsettled? Oldest first, so a backlog drains in order and the ledger
      # curve is built in the sequence the nights actually happened.
      # ------------------------------------------------------------------------------------
      # ------------------------------------------------------------------------------------
      # REGRADE-2026-09-04. Runs BEFORE the finder, and before soccer_settle.js -- the settle
      # script rewrites `hr` from the live feed, and soccer_unfold.py can only reconcile a board
      # that still describes the grades that were folded. Unfold removes the date from
      # graded_nights, so the finder below then picks it up as unsettled by the ordinary path
      # and the rest of this workflow does not need to know a regrade happened.
      # ------------------------------------------------------------------------------------
      - name: Unfold the night being regraded
        if: github.event.inputs.regrade == 'true'
        run: |
          cd soccer
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then
            echo "::error::regrade requires an explicit date -- refusing to guess which night to unwind."
            exit 1
          fi
          if [ ! -f "boards/$D.json" ]; then
            echo "::error::no archived board at soccer/boards/$D.json"
            exit 1
          fi
          python3 soccer_unfold.py "boards/$D.json" --season soccer_season.json \
            --reason "regrade dispatched by ${{ github.actor }} (run ${{ github.run_id }})"

      - name: Find unsettled boards
        id: find
        run: |
          cd soccer
          mkdir -p boards
          # A board published before CATCHUP only exists as soccer_D.json. Adopt it into the
          # archive so this workflow can see it -- one-time, harmless once boards/ is populated.
          if [ -f soccer_D.json ]; then
            D=$(python3 -c "import json;print(json.load(open('soccer_D.json'))['meta']['date'])")
            [ -f "boards/$D.json" ] || cp soccer_D.json "boards/$D.json"
          fi
          PICK="${{ github.event.inputs.date }}"
          python3 - "$PICK" <<'PY' >> $GITHUB_OUTPUT
          import json, os, sys, glob
          pick = (sys.argv[1] or '').strip()
          graded = set(json.load(open('soccer_season.json')).get('graded_nights', []))
          todo = []
          for f in sorted(glob.glob('boards/*.json')):
              d = os.path.basename(f)[:-5]
              if d in graded:      continue
              if pick and d != pick: continue
              todo.append(d)
          print('dates=' + ' '.join(todo))
          print('n=%d' % len(todo))
          PY
          echo "unsettled: $(grep '^dates=' $GITHUB_OUTPUT | cut -d= -f2-)"

      # ------------------------------------------------------------------------------------
      # One night at a time. A failure to settle 08-25 must never stop 08-26 from settling --
      # that is the whole point of catching up, so the loop does not abort on a non-zero rc.
      # ------------------------------------------------------------------------------------
      - name: Settle each unsettled night
        if: steps.find.outputs.n != '0'
        id: run
        run: |
          cd soccer
          FOLDED=""
          for D in ${{ steps.find.outputs.dates }}; do
            B="boards/$D.json"
            echo "::group::$D"
            set +e
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              node soccer_settle.js "$B" --force
            else
              node soccer_settle.js "$B"
            fi
            RC=$?
            set -e
            case $RC in
              0)
                echo "$D: every match final -- folding"
                python3 soccer_grade.py "$B" --season soccer_season.json
                FOLDED="$FOLDED $D"
                ;;
              20) echo "::notice::$D not finished yet; will retry on the next pass." ;;
              30) echo "::warning::$D: no usable results feed this pass; not folding." ;;
              *)  echo "::error::$D: soccer_settle.js exited $RC" ;;
            esac
            echo "::endgroup::"
          done
          echo "folded=$FOLDED" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------------------
      # STAMPBOARD-2026-09-04. fold() stamps the board it grades, so every night from here on
      # records its own `final` / `won` / `net` / `stake`. The nights already in graded_nights
      # will never be reopened by the finder above -- that is what graded_nights is for -- so
      # they are backfilled here instead.
      #
      # Runs on EVERY pass on purpose. stamp() is a pure function of the board: no network, no
      # ledger, and an already-stamped board comes out byte-identical, so this is a no-op from
      # the second pass onward and self-heals any night added later.
      # ------------------------------------------------------------------------------------
      - name: Stamp settled boards with their own result
        id: stamp
        run: |
          cd soccer
          if ! ls boards/*.json >/dev/null 2>&1; then
            echo "no archived boards"; echo "stamped=false" >> $GITHUB_OUTPUT; exit 0
          fi
          python3 soccer_grade.py --stamp boards/*.json | tee stamp.txt
          if git -C .. diff --quiet -- soccer/boards/; then
            echo "stamped=false" >> $GITHUB_OUTPUT
          else
            echo "stamped=true"  >> $GITHUB_OUTPUT
          fi
          rm -f stamp.txt

      - name: Commit
        if: steps.run.outputs.folded != '' || steps.stamp.outputs.stamped == 'true'
        run: |
          git config user.name  "kasper-bot"
          git config user.email "kasper-bot@users.noreply.github.com"
          git add soccer/soccer_season.json soccer/boards/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            # STAMPBOARD-2026-09-04. "Settle soccer" over a commit that settled nothing is
            # a lie in the log, and a stamp-only pass settles nothing by definition.
            FOLDED="${{ steps.run.outputs.folded }}"
            if [ -n "$FOLDED" ]; then MSG="Settle soccer$FOLDED";
            else MSG="Stamp settled soccer boards with their own result"; fi
            git commit -m "$MSG"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { echo "pushed"; exit 0; }
              sleep 5
            done
            echo "::error::could not push after 3 attempts"; exit 1
          fi
