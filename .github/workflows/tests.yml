# 🚨 CI-2026-09-08 -- SOMETHING HAS TO RUN THE TESTS.
#
# Until this file existed, NOTHING did. soccer-build.yml, nfl-build.yml and pull-slate.yml invoke
# no test at all, and there was no CI workflow in the repo. Every test here only ran when a human
# typed its name.
#
# What that cost, measured 2026-09-08: test_redraft.js is byte-identical to the version that
# shipped on 2026-08-31 and is ALL GREEN against the engine of that date. It has been red on main
# ever since, through eight doctrine changes -- ANCHORSET, ANCHORFIRST, DRAFTORDER, DRAFTWIDE,
# ANCHORGATE, SNAKEDRAFT (09-04), ANCHORCAP (09-06), ONEGAMESINGLES (09-08) -- and nobody heard
# about it, because nothing was listening. test_draft_golden.js went from 2 red to 7 the same way.
#
# ⚠️ NAMING TRAP, AND IT IS LIVE IN THIS REPO. `soccer/*_fix.py` are ONE-SHOT PATCH SCRIPTS from
# past sessions, not tests -- test_redraft_fix.py is the script that PATCHED test_redraft.js, and
# running it would rewrite a test file inside CI. They are excluded by suffix, not by listing them,
# so a new one cannot sneak in.
#
# ⚠️ QUARANTINE EXISTS BUT IS EMPTY, AND THAT IS THE POINT. It held two suites for one afternoon
# while their failures were diagnosed rather than papered over; both are green now and it was
# emptied the same day (see claude/testredraft-stale-2026-09-08.md). The mechanism stays because
# the next red suite deserves the same treatment: run it, print it, do NOT fail the build on it,
# and write down why -- a CI that is red on day one and stays red teaches everyone to ignore it,
# which is the failure being fixed, not a fix. A quarantined suite that goes green says so out
# loud. Emptying it is always the goal; adding to it needs a reason written down here.

name: Tests

# ⚠️ THE PATH FILTER IS LOAD-BEARING, NOT TIDINESS. The boards live in the repo and are rewritten
# every few minutes by three build workflows -- soccer/index.html, soccer/soccer_D.json,
# soccer/boards/, soccer/slates/, nfl/, and the root index.html and D_*.json are all DATA that
# changes all day. A bare `soccer/**` trigger would run this suite every five minutes, forever,
# and burn the runner budget on a slate that has not touched a line of code.
# So: trigger on CODE, exclude the data, and keep a DAILY run as the backstop. The daily one is
# what covers the awkward case -- index.html is both the MLB engine AND the MLB board, so it
# cannot be watched by path without watching every build. A code change there is caught within a
# day, or immediately by opening a PR, or by hand with workflow_dispatch.
on:
  push:
    paths:
      - 'soccer/**'
      - 'nfl/**'
      - 'build15.py'
      - 'test_suffixkey.py'
      - 'commit_gate.py'
      - '.github/workflows/tests.yml'
      - '!soccer/boards/**'
      - '!soccer/slates/**'
      - '!soccer/settled/**'
      - '!soccer/index.html'
      - '!soccer/soccer_D.json'
      - '!soccer/soccer_season.json'
      - '!nfl/slates/**'
      - '!nfl/index.html'
      - '!nfl/nfl_D.json'
      - '!nfl/nfl_season.json'
  pull_request:
  schedule:
    - cron: '17 11 * * *'        # 11:17Z daily -- the backstop for index.html and anything the
                                 # path filter cannot watch. Quiet hour: no board builds land here.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------------------------
      # Discovery, not a hand-kept list: a test added tomorrow runs tomorrow. That is the whole
      # point -- a list is a thing to forget to update, which is how we got here.
      # ------------------------------------------------------------------------------------
      # ⚠️ THE LIST TRAVELS IN A FILE, NOT THROUGH `${{ }}`. A step output is pasted into the shell
      # as TEXT before bash parses it, so a multi-line list turns `for t in $LIST; do` into
      # `for t in first.js` + a newline + the rest -- a syntax error, exit 2, and the first cut of
      # this workflow died on exactly that. A file also means test paths are never interpolated
      # into a command line, which is the injection shape GitHub warns about.
      - name: What are we running?
        run: |
          # `*_fix.py` are patch scripts, NOT tests -- see the header.
          find . -name 'test_*.js' -o -name 'test_*.py' \
            | grep -v '_fix\.py$' | grep -v '/node_modules/' | sed 's|^\./||' | sort > /tmp/tests.txt
          # QUARANTINE -- EMPTY, 2026-09-08, and the goal is that it stays that way.
          # It held test_redraft.js and test_draft_golden.js for one afternoon. Both are green now:
          # the redraft one because PINWINS-2026-09-08 brought the CODE back to doctrine (a
          # confirmed partner is no longer pulled off an open slip for an anchor seat -- owner's
          # ruling), and the golden one because GOLDENRECUT-2026-09-08 re-cut a golden whose move
          # was traced to DRAFTWIDE-09-04 first. Neither was made green by editing an assertion to
          # agree with whatever the engine printed.
          : > /tmp/quarantine.txt
          echo "  discovered $(wc -l < /tmp/tests.txt) suites:"; sed 's/^/    /' /tmp/tests.txt
          echo "  quarantined:"; sed 's/^/    /' /tmp/quarantine.txt
          echo "  excluded as patch scripts:"; find . -name '*_fix.py' | sed 's|^\./|    |' | sort

      # ⚠️ ONE SUITE NEEDS A REAL BROWSER, and it is the most valuable one -- test_stage2_page.js
      # forks a soccer page out of the root index.html and drives it in Chromium, which is how it
      # checks that the PAGE renders the published board and never authors one. It passed on the
      # machine this workflow was written on only because Chromium was already installed there,
      # and failed on the first real run. Install it here, and DETECT the need rather than
      # hardcoding it: a browser test added tomorrow gets its browser tomorrow, and the day the
      # last one goes away this step costs nothing.
      - name: Browser, only if a suite needs one
        run: |
          if xargs -a /tmp/tests.txt grep -l "require('playwright')" 2>/dev/null | grep -q .; then
            echo "  a suite needs playwright:"
            xargs -a /tmp/tests.txt grep -l "require('playwright')" | sed 's/^/    /'
            npm install --no-save playwright
            npx playwright install --with-deps chromium
          else
            echo "  no suite needs a browser -- skipping the install"
          fi

      # ------------------------------------------------------------------------------------
      # Each test runs from ITS OWN directory. They are written that way: the python ones import
      # their module from cwd (test_mononym imports soccer_teamnews), and the node ones resolve
      # fixtures off __dirname. Running them from the repo root passes some and breaks others.
      # ------------------------------------------------------------------------------------
      - name: Run the suite
        run: |
          FAILED=""; PASSED=""; QUAR=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            skip=""
            grep -qxF "$t" /tmp/quarantine.txt && skip=1
            d=$(dirname "$t"); b=$(basename "$t")
            case "$b" in *.js) CMD="node $b";; *.py) CMD="python3 $b";; esac
            echo "::group::$t"
            if ( cd "$d" && timeout 300 $CMD ); then
              if [ -n "$skip" ]; then QUAR="$QUAR $t(green!)"; else PASSED="$PASSED $t"; fi
            else
              if [ -n "$skip" ]; then QUAR="$QUAR $t(red)"; else FAILED="$FAILED $t"; fi
            fi
            echo "::endgroup::"
          done < /tmp/tests.txt

          echo
          echo "================ RESULT ================"
          for t in $PASSED; do echo "  pass        $t"; done
          for t in $QUAR;   do echo "  quarantine  $t"; done
          for t in $FAILED; do echo "  FAIL        $t"; done
          echo "========================================"

          # A quarantined suite that has gone GREEN is news: take it off the list.
          case "$QUAR" in
            *"(green!)"*) echo "::notice::a quarantined suite is passing -- take it off the QUARANTINE list" ;;
          esac

          if [ -n "$FAILED" ]; then
            echo "::error::failing:$FAILED"
            exit 1
          fi
          echo "all non-quarantined suites pass"
