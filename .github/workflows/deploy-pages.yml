name: Deploy Pages

# Publishes the self-contained board to GitHub Pages.
# Replaces the automatic "deploy from branch" flow, which cancels its own
# in-progress deploy on every push -- so with the ~6-min scratch re-drafts the
# site could never finish deploying and served a stale day. Here:
#   * concurrency guard (cancel-in-progress: false) lets the running deploy
#     FINISH and queues only the latest -- no more cancelled/stacked deploys.
#   * we publish index.html + CNAME + the LAST FEW D_<date>.json boards, so each
#     deploy is a few seconds instead of minutes and they stop colliding.
#
# 2026-08-17 -- ADOPTFILE, ENABLED THEN REVERTED THE SAME DAY. DO NOT RE-ENABLE
# UNTIL adoption MERGES INSTEAD OF REPLACING. Publishing D_<date>.json makes
# ADOPT-2026-08-16 actually run -- and adoption does `D.tickets = j.tickets`,
# which DELETES a confirmed ticket this tab is holding BEFORE CONFLOCK can see
# it. `prior` is read from D.tickets, so CONFLOCK freezes only what adoption
# already kept: the 08-16 claim that "CONFLOCK freezes anything confirmed, so
# adoption can only move what is not bettable" is circular and false. Live proof
# 2026-08-17: a CONFIRMED Family Meal single (Michael Toglia) was re-derived away
# and replaced with Eugenio Suarez within minutes of adoption first working.
# Fix adoption to carry forward every prior ticket that is underway or fully
# confirmed, THEN restore the staging line below. Original note kept:
# The D_<date>.json files are NOT optional.
# `ADOPT-2026-08-16` in index.html does `fetch('D_'+date+'.json?cb=...')` -- a RELATIVE
# url -- on every live refresh, so an open tab can pick up a newer server board instead
# of re-drafting its load-time copy forever. This workflow published ONLY index.html,
# so that fetch returned the Pages 404 page, `r.ok` was false, the chain resolved to
# null, and adoption was skipped. It "fails soft", i.e. SILENTLY, which is why it went
# unnoticed: the fix for the 08-15 stale-tab incident had never once run on the live
# site. Its harness passed because the harness served the json next to the page.
# If you ever trim this staging step again, adoption dies silently with it.
# We keep the newest 3 boards, not all of them: a tab does not roll over at midnight,
# so yesterday's tab still asks for yesterday's file, but 55 boards is ~45 MB of artifact.

on:
  push:
    branches: [main]
    paths: ['index.html', 'CNAME', 'cover.html', 'soccer/index.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site files (board + custom domain + boards the client adopts)
        run: |
          # PATHS-2026-08-26 -- THE SWAP. The site root is the COVER; the baseball board moved
          # to /mlb/. This is done HERE, in staging, and NOT by moving files in the repo:
          # pull-slate.yml rebuilds and commits repo `index.html` every few minutes (see its
          # `git add ... index.html`), so anything parked at that path gets overwritten by the
          # next board build. The repo layout is owned by the build pipeline; the URL layout is
          # owned by this step. Keep it that way.
          mkdir -p _site _site/mlb
          cp index.html _site/mlb/
          [ -f CNAME ] && cp CNAME _site/ || true
          # SOCCER-2026-08-26 -- the second room. soccer/index.html is built by
          # soccer_fork.py from THIS index.html by named seam replacement, so it is a
          # published artifact, not a source file. It is self-contained exactly like the
          # baseball board: one file, its slate baked into `const D`, and a live loop that
          # reads ESPN directly. It needs NO D_<date>.json staged beside it -- the soccer
          # loop refreshes results in place and deliberately does not adopt a newer file
          # (see the ADOPTFILE note above; the same bug would eat a confirmed soccer slip).
          if [ -f soccer/index.html ]; then mkdir -p _site/soccer && cp soccer/index.html _site/soccer/; fi
          # The cover page: two doors, one to each room. It IS the front door now.
          # Also kept at /cover.html, its original URL, so nothing that already points there
          # breaks -- same file, two paths, no redirect to maintain.
          # An already-open baseball tab is unaffected: the board never reloads itself (its
          # live loop patches the DOM in place), so only a hard refresh lands on the cover.
          if [ -f cover.html ]; then cp cover.html _site/index.html && cp cover.html _site/; fi
          # LEDGER-2026-08-26 -- season totals for the cover's P&L pills, DERIVED here rather
          # than committed, so they can never go stale against season.json.
          # This is NOT D_<date>.json and must never become it: it carries `since` and `cats`
          # and nothing else. No tickets, no players -- so there is nothing an adoption path
          # could pick up and re-derive a confirmed slip away from (see the ADOPTFILE note at
          # the top of this file). If you are tempted to add `tickets` here, read that note
          # first and then do not.
          mkledger() { [ -f "$1" ] && [ -d "$(dirname "$2")" ] && python3 -c 'import json,sys; j=json.load(open(sys.argv[1])); json.dump({"since":j.get("since"),"cats":j.get("cats",{})},open(sys.argv[2],"w"))' "$1" "$2" && echo "ledger $2" || echo "skip $1"; }
          mkledger season.json _site/ledger.json
          mkledger soccer/soccer_season.json _site/soccer/ledger.json
          echo "staged:"; ls -laR _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # wait up to 30 min for Pages to publish (default 10 min was timing out during Pages congestion)
