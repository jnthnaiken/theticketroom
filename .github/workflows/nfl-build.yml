name: Build NFL Board

# Rebuilds the football room and commits nfl/index.html.
#
# ⚠️ PRICEONCE (claude/priceonce-doctrine.md). Owner's rule: "soccer and football price ONE TIME
# at build, like baseball. any changes in model total would be due to live weather updates etc."
# nfl_mock.py merges slates/<date>/atd.psv into slates/<date>/prices.json HOLDING every existing
# entry and appending only new names, and prices.json is COMMITTED. So this cron may run as often
# as it likes and no price already on the board can move -- the merge enforces the rule, not the
# scrape. What legitimately moves a TOTAL is weather, refreshed every pass by nfl_wx.py.
#
# ⚠️ IT DOES NOT GRADE, BUT IT HAS ITS OWN LEDGER (OWNLEDGER-2026-09-04). This block used to
# say "meta.season is whatever season.json holds, WHICH IS NOTHING" -- an assumption stated as
# a fact, and wrong. The staging step below copied `../season.json`, the BASEBALL ledger, and
# nfl_payload.py baked it in verbatim: the football room published 88 graded nights since
# 2026-06-30 and +529.8u on 1066u risked, under football labels, on a slate that has not
# kicked off. Owner: "football needs its own ledger. its showing baseball right now."
# nfl_season.json is now that ledger, opening 0-0, staged under its own NAME so no future
# edit can hand this room the baseball file by matching a filename.
# When a settle workflow arrives it owns nfl_season.json, and the board's baked meta.season
# must stay the ledger EXCLUDING the current week or every ticket counts twice
# (soccer-build.yml learned this).

on:
  # DISPATCHFALLBACK-2026-08-27, inherited. soccer-build.yml records that its `schedule:` has
  # essentially never fired in this repo while pull-slate.yml's */5 fires all day, so it listens
  # for the dispatches that demonstrably arrive instead. Same here. The commit gate makes a no-op
  # pass free, so extra triggers cost nothing.
  repository_dispatch:
    types: [tick, build-tick, build-board, build-nfl]
  schedule:
    # Sunday, dense through the American afternoon: 12:00-23:00Z is 8am-7pm ET, which covers the
    # inactives reports (90 minutes before each kickoff) for the 13:00 and 16:25 waves. Prices
    # are frozen, so what a rebuild moves is weather and scratches.
    - cron: '*/20 12-23 * * 0'
    # NON-SUNDAY SLATES (2026-09-08). Week 1 opens on a WEDNESDAY and the international game is
    # a THURSDAY; there are Thursday, Saturday and Monday cards all season. Those days are
    # covered by the `tick` dispatch above, which fires all day -- but the dispatch is another
    # workflow's favour, so the evening waves get their own cron rather than depending on it.
    # 22:00-03:00Z is 6pm-11pm ET, i.e. inactives through the end of a 20:20 kickoff.
    - cron: '*/20 22-23 * * 1,3,4,6'
    - cron: '*/20 0-3 * * 2,4,5,0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and report, but commit nothing."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: nfl-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 🚨 DEPLOYTOKEN-2026-08-31. A push made with the default GITHUB_TOKEN does not trigger any
      # further workflow run. This job commits nfl/index.html, which IS in deploy-pages.yml's
      # `paths:` -- and without a PAT that commit will never start a deploy. The soccer board sat
      # committed-and-undeployed for exactly this reason and only went live when some OTHER
      # commit happened to fire the deploy. Falls back to github.token: the push still works, it
      # just does not deploy.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pandas numpy scikit-learn

      # --------------------------------------------------------------------------------------
      # 🚨 SETTLENFL-2026-09-10 -- GRADE FINISHED NIGHTS BEFORE ANYTHING ELSE.
      # Owner: "well it was graded until you published the new board". nfl_live.js grades in the
      # browser and saves nothing, so a night's result lived only as long as its board was the
      # one on the page. Publish now archives every board as nfl/boards/<date>.json; this step
      # grades each archived board whose games are all FINAL on ESPN and is not yet in
      # nfl_season.json, using soccer_grade.fold() (one grader for both rooms). It runs before the
      # slate is resolved and staged, so the ledger the page bakes already includes the night.
      # Never fatal: a network miss leaves the night for the next build.
      # --------------------------------------------------------------------------------------
      - name: Settle finished boards
        id: settle
        continue-on-error: true
        run: |
          cd nfl
          python3 nfl_settle.py --season nfl_season.json --boards boards --slates slates
          if git diff --quiet -- nfl_season.json boards/; then
            echo "settled=false" >> $GITHUB_OUTPUT
          else
            echo "settled=true" >> $GITHUB_OUTPUT
            echo "::notice::a football night was graded into nfl_season.json"
            # Committed HERE, not left for Publish: on a day with no open slate Publish never runs,
            # and an uncommitted grade would be thrown away with the runner.
            cd ..
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nfl/nfl_season.json nfl/boards/
            git commit -m "NFL settle ($(date -u +%H:%MZ))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { echo "pushed settle"; break; }
              sleep $((i*5))
            done
          fi

      # --------------------------------------------------------------------------------------
      # WHICH SLATE? The EARLIEST one that has not finished. SLATEPICK-2026-09-08.
      #
      # This step used to be `ls slates/*/ | sort | tail -1` plus a whole-day grace, i.e. "the
      # NEWEST directory, unless yesterday is already past it". Both halves are wrong the moment
      # two slates are open at once, which is exactly what week 1 looks like: a Wednesday opener
      # (2026-09-09) and the Sunday card (2026-09-13) are committed at the same time, and
      # `tail -1` picks SUNDAY -- so on opener day the football room would have published a
      # board for a slate four days away, with the actual game live on television. The whole-day
      # grace hid it for a while and then broke the other way, holding a finished slate up all
      # of the next day whenever game days run back to back.
      #
      # The honest rule is the one a reader would state: a slate is today's board until its own
      # last game is over. So: last kickoff + GRACE, in ET (kickoff units in fixtures.json are
      # ET minutes past midnight -- 780=13:00, 985=16:25, 1220=20:20), and take the FIRST slate
      # still inside that window. Sunday therefore takes over by itself once Wednesday's game
      # is done; nothing has to be deleted, and nothing has to be committed on the day.
      # --------------------------------------------------------------------------------------
      - name: Resolve the slate
        id: slate
        run: |
          cd nfl
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import datetime, glob, json, os, sys
          from zoneinfo import ZoneInfo

          GRACE = 240          # minutes after the last kickoff that a slate is still "today"
          ET    = ZoneInfo('America/New_York')
          now   = datetime.datetime.now(ET)
          log   = lambda m: print(m, file=sys.stderr)

          log(f'now {now:%Y-%m-%d %H:%M} ET')
          best = None
          for fx in sorted(glob.glob('slates/*/fixtures.json')):
              d = os.path.basename(os.path.dirname(fx))
              try:
                  j = json.load(open(fx, encoding='utf-8'))
              except Exception as e:
                  log(f'::warning::{fx} unreadable ({e}) -- skipped'); continue
              kos  = [m.get('kickoff') for m in j.get('matches', {}).values()
                      if m.get('kickoff') is not None]
              last = max(kos) if kos else 1440      # no kickoffs recorded -> hold all day
              y, mo, da = (int(x) for x in d.split('-'))
              close = (datetime.datetime(y, mo, da, tzinfo=ET)
                       + datetime.timedelta(minutes=last + GRACE))
              log(f'  {d}: last kickoff {last // 60:02d}:{last % 60:02d} ET, '
                  f'live until {close:%m-%d %H:%M} ET'
                  + ('  <-- CURRENT' if close > now and best is None else ''))
              if close > now and best is None:
                  best = (d, j)

          if best is None:
              log('every committed slate is finished -- nothing to rebuild')
              print('go=false'); raise SystemExit(0)

          d, j = best
          for f in ('atd.psv', 'fixtures.json'):
              if not os.path.exists(f'slates/{d}/{f}'):
                  log(f'::error::nfl/slates/{d}/{f} missing'); raise SystemExit(1)

          log(f"slate {d} (season {j['season']} week {j['week']}, "
              f"{len(j.get('matches', {}))} games)")
          print(f'date={d}')
          print(f"season={j['season']}")
          print(f"week={j['week']}")
          print('go=true')
          PY

      - name: Stage the work directory
        if: steps.slate.outputs.go == 'true'
        run: |
          cd nfl
          rm -rf .work && mkdir -p .work
          cp slates/${{ steps.slate.outputs.date }}/atd.psv .work/
          cp slates/${{ steps.slate.outputs.date }}/fixtures.json .work/
          # prices.json is the PRICEONCE ledger. Absent on the first build of a slate, which is
          # the only time a price may be written.
          cp slates/${{ steps.slate.outputs.date }}/prices.json .work/ 2>/dev/null || true
          cp nfl_*.py .work/
          # LIVEJS-2026-09-10: nfl_live_seams.py (imported by nfl_fork.py) reads nfl_live.js from .work.
          # It was never staged, so every build since the live seams landed died in the fork step.
          cp nfl_draft_cli.js nfl_live.js depth_prior.csv depth_model.json nfl_model.json .work/
          cp ../soccer/soccer_draft.js .work/     # ONE DRAFT, THREE SPORTS
          cp ../index.html .work/index_live.html
          # OWNLEDGER-2026-09-04. THE FOOTBALL LEDGER, and never `../season.json`, which is
          # baseball's. Kept under its own name in .work/ for the same reason.
          cp nfl_season.json .work/

      # ⚠️ WEATHER IS THE ONLY SANCTIONED SOURCE OF TOTAL MOVEMENT. A miss here is silent in the
      # payload (every factor falls back to ~1.0), so it is logged loudly and never fatal.
      - name: Stadium weather
        if: steps.slate.outputs.go == 'true'
        continue-on-error: true
        run: cd nfl/.work && python3 nfl_wx.py fixtures.json wx.json

      - name: Score, draft, payload, fork
        if: steps.slate.outputs.go == 'true'
        run: |
          cd nfl/.work
          python3 nfl_mock.py ${{ steps.slate.outputs.season }} ${{ steps.slate.outputs.week }} \
                  --atd atd.psv --fixtures fixtures.json --prices prices.json --out scored.json
          # INJOUT-2026-09-11: a man ESPN lists as Out / IR / Suspended is `out` before the draft
          # sees him (Brock Bowers rode a live moon two days after being ruled Out). Never fatal.
          python3 nfl_injuries.py scored.json fixtures.json || echo "::warning::nfl_injuries.py failed -- drafting without the injury report"
          node nfl_draft_cli.js scored.json fixtures.json tickets.json
          python3 nfl_payload.py scored.json tickets.json fixtures.json nfl_D.json \
                  $([ -f wx.json ] && echo "--wx wx.json") \
                  --season nfl_season.json \
                  --build "$(TZ=America/New_York date '+%-m/%-d %-I:%M%P')"
          python3 nfl_fork.py index_live.html nfl_D.json nfl_index.html

      # --------------------------------------------------------------------------------------
      # THE COMMIT GATE.
      # ⚠️ GATE ON THE SCORED PAYLOAD, NOT JUST THE NAMES. soccer-build.yml gates on "the DRAFT
      # and the PLAYERS", and on 2026-09-03 that suppressed a real republish: a corrected xg.psv
      # moved every TOTAL on the soccer board while the four ticket names stayed identical, so
      # the gate called it unchanged and the live board served the pre-correction scores for
      # hours. A score IS what a reader notices -- it is the number on the chip. Hash the
      # tickets AND every player's TOTAL and odds.
      # --------------------------------------------------------------------------------------
      - name: Did anything a reader would notice change?
        id: gate
        if: steps.slate.outputs.go == 'true'
        run: |
          cd nfl/.work
          # SETTLENFL-2026-09-10: the baked season ledger is something a reader notices too (the
          # SEASON panel). Without it a night graded into nfl_season.json never reached the page
          # until some unrelated TOTAL moved.
          SEASON_SIG='import json,sys,hashlib;print(hashlib.md5(json.dumps(json.load(open(sys.argv[1]))["meta"].get("season"),sort_keys=True).encode()).hexdigest()[:12])'
          NEW="$(python3 nfl_sig.py nfl_D.json):$(python3 -c "$SEASON_SIG" nfl_D.json)"
          OLD=$([ -f ../nfl_D.json ] && echo "$(python3 nfl_sig.py ../nfl_D.json):$(python3 -c "$SEASON_SIG" ../nfl_D.json)" || echo "")
          echo "new=$NEW"
          echo "old=$OLD"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "nothing a reader would notice moved"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.slate.outputs.go == 'true' && (steps.gate.outputs.changed == 'true' || steps.settle.outputs.settled == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          cd nfl
          cp .work/nfl_index.html index.html
          cp .work/nfl_D.json    nfl_D.json
          cp .work/prices.json   slates/${{ steps.slate.outputs.date }}/prices.json
          # SETTLENFL-2026-09-10: the archive nfl_settle.py grades from once the slate is over.
          mkdir -p boards && cp .work/nfl_D.json "boards/${{ steps.slate.outputs.date }}.json"
          cd ..
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl/index.html nfl/nfl_D.json nfl/nfl_season.json nfl/boards/ \
                  nfl/slates/${{ steps.slate.outputs.date }}/prices.json
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "NFL board ${{ steps.slate.outputs.date }} ($(date -u +%H:%MZ))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && { echo "pushed"; exit 0; }
            sleep $((i*5))
          done
          echo "::error::could not push after 3 attempts"; exit 1
