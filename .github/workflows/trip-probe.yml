name: Trip probe

# TRIPPROBE-2026-10-24 -- one-off: which soccer / football input sources can a GitHub runner reach without a
# browser? (owner away 10-28..11-10 with his only computer; wants the site to run itself). Result lands on
# soccer-data:trip/probe.txt. Delete once the automation ships.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/trip-probe.yml', 'tools/fotmob_hist_check.py', 'soccer/history/fetch_history_fotmob.py', 'tools/xg_compare.py', 'tools/xg_sources_probe.js', 'soccer/auto_slate.js', 'tools/understat_probe.js', 'tools/trip_probe.js', 'tools/fd_probe.js', 'nba/kotc.js', 'tools/kotc_restate.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        run: |
          set +e
          pip install --quiet pandas numpy
          git fetch -q --depth 1 origin soccer-data && mkdir -p hb && git show FETCH_HEAD:history/2014-2026-limit0/team_matches.csv.gz > hb/team_matches.csv.gz && git show FETCH_HEAD:history/2014-2026-limit0/player_matches.csv.gz > hb/player_matches.csv.gz
          (time python3 soccer/history/fetch_history_fotmob.py --base hb --out fresh --season 2026 --cache fmc) > probe.txt 2>&1
          python3 tools/fotmob_hist_check.py hb fresh >> probe.txt 2>&1
          curl -s -o /dev/null -w "curl oddschecker winner: %{http_code}\n" -A "Mozilla/5.0" https://www.oddschecker.com/football/english/premier-league/liverpool-v-brighton/winner >> probe.txt
          curl -s -o /dev/null -w "curl understat: %{http_code}\n" -A "Mozilla/5.0" https://understat.com/league/EPL/2026 >> probe.txt
          cat probe.txt
      - name: Save
        run: |
          git config --global user.email "actions@github.com"; git config --global user.name "trip-probe"
          git clone -q --depth 1 -b soccer-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" d
          mkdir -p d/trip && cp probe.txt d/trip/probe.txt && cd d && git add trip/probe.txt && git commit -qm "Trip probe $(date -u +%FT%TZ)" && git push -q
