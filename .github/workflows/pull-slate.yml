# ====================================================================================
# Build Ticket Room -- daily MLB HR-prop board pipeline.
#
# Pipeline: grade prior night -> pull StatsAPI/weather -> verify the pull is fresh ->
# score -> assemble+inject the board -> commit. regen15.py does BOTH the assemble and
# the inject into index.html. Do not add any other inject/score step.
#
# TRIGGERS:
#   repository_dispatch (event_type "build-board")  <- your external cron hits this
#   workflow_dispatch                               <- the "Run workflow" button
#   schedule                                        <- backup; GitHub often drops these
#
# SLATE DATE = the latest committed cards_<date>.json, NOT the calendar day. This HOLDS the
# last slate you actually built (graded) until you commit a new day's cards -- so the board
# never rolls onto a fresh, ungraded slate built from yesterday's fallback data overnight.
# (A manual workflow_dispatch with an explicit date still overrides.)
# ====================================================================================

name: Build Ticket Room

on:
  repository_dispatch:
    # build-board = the external cron (every 30 min, reliable). build-tick = ticker.yml filling
    # in the 5-minute gaps between them. Only build-board starts a ticker -- see the last step.
    types: [build-board, build-tick]
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (blank = latest committed cards)"
        required: false
        default: ""
      force:
        # Rebuild a slate that is already final. For a DATA FIX, not for routine use: it re-pulls,
        # re-scores and re-drafts the night from scratch, ignoring the prior board. Used 2026-08-04 to
        # rebuild 8/3 after build15 was found to be reading the projected lineup file instead of MLB's
        # posted card (it had Rumfield batting 5th for COL; the real card had Moniak, who was stamped
        # scratched, barred from every ticket, and homered).
        description: "Force a rebuild even if the slate is final (data fix). Drafts from scratch."
        required: false
        default: "false"
  schedule:
    # EVERY 5 MINUTES, not twice an hour. The browser re-drafts on every page load and sees a
    # scratch as soon as MLB posts it; the server only sees one at its next build. Whatever is
    # archived at a ticket's lock is what grade_night.py grades -- and for a Chef's Table seat that
    # gap decides refund-vs-substitute, since the seat is held with a Missed Reservation stamp once
    # its own game is underway. At 30-minute spacing a late scratch could miss the last build before
    # first pitch entirely; at 5 the archive is never more than ~5 minutes behind the screen.
    # Scheduled runs are also dropped often under load, so the density doubles as redundancy.
    # This does NOT mean a deploy every 5 minutes: commit_gate.py holds the commit unless something
    # real moved (see the commit step).
    - cron: "*/5 16-23,0-5 * * *"

permissions:
  contents: write
  actions: write   # cancel a Pages deploy that hung in "waiting" -- see the watchdog step

concurrency:
  group: ticket-room
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # PAGES WATCHDOG.  deploy-pages.yml uses concurrency group "pages" with
      # cancel-in-progress: false, so a running deploy always finishes.  The
      # failure mode that costs us a day: a run parks in status "waiting" on
      # the github-pages environment and never starts.  It holds the group
      # forever, every later deploy queues behind it and is superseded by the
      # next one, and the site freezes on whatever board was last published.
      # Seen 2026-08-06: run #1566 sat in "waiting" 10h; the live board stayed
      # on the 8/6 7:36pm build through the whole 8/7 morning while main was
      # correct the entire time.  Cancelling the stuck run let the queue drain
      # and the site went current in ~90 seconds.
      # This job is in the "ticket-room" group, not "pages", so it can always
      # run and clear the jam.
      - name: Unstick a hung Pages deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          now=$(date -u +%s)
          gh api "repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/runs?status=waiting&per_page=20" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at)"' 2>/dev/null | while read -r id created; do
              age=$(( now - $(date -u -d "$created" +%s) ))
              # 15 min: a real deploy of one HTML file takes seconds, and a legitimate
              # queue wait behind a running deploy clears in well under that.
              if [ "$age" -gt 900 ]; then
                echo "::warning::Pages deploy $id stuck in waiting for ${age}s -- cancelling so the queue can drain"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              fi
            done

      - name: Resolve slate date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            D="${{ github.event.inputs.date }}"
          else
            # latest committed cards_<date>.json -> HOLD the last real slate until new cards land
            D="$(ls cards_*.json 2>/dev/null | sed -E 's/.*cards_([0-9]{4}-[0-9]{2}-[0-9]{2})\.json/\1/' | sort | tail -n1)"
            [ -z "$D" ] && D="$(TZ=America/New_York date +%F)"
          fi
          echo "SLATE_DATE=$D" >> "$GITHUB_ENV"
          echo "Building slate for $D"

      - name: Grade finished nights
        run: python3 grade_night.py

      - name: Log calibration (idempotent, self-healing)
        run: python3 calibrate.py --backfill

      - name: Pull slate (StatsAPI + Open-Meteo)
        run: python3 fetch_mlb.py "$SLATE_DATE"

      - name: Verify the slate was pulled fresh
        id: verify
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force }}
        run: |
          python3 - "$SLATE_DATE" <<'PY'
          import json, os, sys
          d = sys.argv[1]; f = f"slate_auto_{d}.json"
          s = json.load(open(f))
          pa = str(s.get("pulled_at", ""))
          games = s.get("games", []) or []
          hr = [((g.get(side) or {}).get("sp") or {}).get("hr9")
                for g in games for side in ("away", "home")]
          have = sum(1 for x in hr if x is not None)
          print(f"{f}: pulled_at={pa!r}  HR/9 {have}/{len(hr)}")
          fresh = not (pa.startswith("manual") or "T" not in pa or have == 0)
          import re as _re
          allfinal = bool(games) and all(_re.search(r"final|completed|over", str(g.get("status") or ""), _re.I) for g in games)
          force = os.environ.get("FORCE_REBUILD", "").lower() == "true"
          if allfinal and force:
              print("::notice::Slate %s is final, but force=true -- rebuilding it from scratch." % d)
          elif allfinal:
              print("::notice::Slate %s is fully final -- board frozen, skipping rebuild." % d)
              fresh = False
          elif not fresh:
              print("::notice::No fresh StatsAPI pull yet (manual/stale or zero HR/9). Skipping "
                    "score+assemble+commit this run -- harmless; a later run builds it.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"fresh={'true' if fresh else 'false'}\n")
          PY

      # ODDS REFRESH. Prices move all day and the board ranks on them: 35% of every
      # strength score, and the Chef's Table seats outright. odds_<date>.json used to be a
      # single morning snapshot written by hand during the browser scrape -- by 5:35pm on
      # 2026-08-08, 228 of its 287 bats (79.4%) had moved. Runs BEFORE build15.py so the
      # whole board scores on current numbers.
      # Fails SOFT twice over: fetch_odds.py refuses to overwrite the file on a short or
      # blocked scrape (<150 HR prices), and continue-on-error means a bad night at
      # VegasInsider can never block a board -- it just builds on the last good prices.
      - name: Refresh odds from VegasInsider
        if: success() && steps.verify.outputs.fresh == 'true'
        continue-on-error: true
        run: python3 fetch_odds.py "$SLATE_DATE"

      - name: Score the field
        if: success() && steps.verify.outputs.fresh == 'true'
        run: python3 build15.py

      # SAVANT GATE -- the Statcast edge fetches fail SOFT: a timed-out leaderboard
      # collapses its signal to a neutral default instead of erroring, so the board
      # still scores and publishes with a term missing, every TOTAL shifts, strength
      # re-orders and the tickets reshuffle against the last good board. Seen on
      # 2026-08-05 (_zspray -51% at 3:31pm, _zpvd dead for all 390 bats at 3:32pm --
      # the chef ticket flipped Schwarber<->Murakami and back). savant_gate.py compares
      # the distinct-value count of every _z* signal against the last committed board
      # for this same date; on a collapse we throw THIS board away and keep the
      # published one, and the next run rebuilds once Savant answers properly.
      - name: Verify the Savant edge signals survived the pull
        id: signals
        if: success() && steps.verify.outputs.fresh == 'true'
        run: |
          if python3 savant_gate.py "$SLATE_DATE"; then
            echo "edge signals healthy"
          else
            echo "::warning::Savant signals degraded -- discarding this board, keeping the published one."
            git checkout -- "D_${SLATE_DATE}.json" 2>/dev/null || rm -f "D_${SLATE_DATE}.json"
          fi

      - name: Assemble + inject the board
        if: success() && steps.verify.outputs.fresh == 'true' && steps.signals.outputs.signals == 'ok'
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force }}
        run: python3 regen15.py

      - name: Commit the board + ledger + calibration
        run: |
          git config user.name  "kasper-bot"
          git config user.email "kasper-bot@users.noreply.github.com"
          git add slate_auto_*.json D_*.json season.json index.html calibration.jsonl
          # Every build rewrites meta.build and pulled_at, so "staged is non-empty" is not the same
          # as "something happened". At a 5-minute cadence that would publish a Pages deploy every
          # 5 minutes all day to change two timestamps. commit_gate.py checks for a REAL change --
          # scratch, odds move, weather, re-draft, graded night, calibration row -- and forces a
          # commit anyway once index.html has gone 25 minutes without one, so the build stamp on the
          # board never looks frozen. It fails OPEN, so a broken gate cannot stop the board.
          if git diff --staged --quiet; then
            echo "no changes to commit"
          elif ! python3 commit_gate.py; then
            git reset -q                       # leave the outputs on the ephemeral runner, publish nothing
          else
            git commit -m "Auto board build ${SLATE_DATE} ($(date -u +%H:%MZ))"
            ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { echo "pushed"; ok=1; break; }
              echo "push attempt $i failed, retrying"; sleep 4
            done
            [ "$ok" = 1 ] || { echo "::error::push failed after 3 attempts -- board NOT updated"; exit 1; }
          fi

      # Hand off to ticker.yml, which dispatches a build every 5 minutes for the next ~25 and
      # then exits, right as the following external cron arrives. ONLY on build-board (the
      # external cron) -- never on the build-tick events the ticker itself sends, so a ticker
      # can never spawn a ticker. always() so a failed build still keeps the cadence alive.
      - name: Start the 5-minute ticker
        if: always() && github.event_name == 'repository_dispatch' && github.event.action == 'build-board'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT is empty -- no ticker; board stays on the 30-minute cadence."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"tick"}' || echo "000")
          echo "ticker start -> HTTP $code"
          [ "$code" = "204" ] || echo "::warning::could not start ticker (HTTP $code) -- 30-minute cadence still applies"
