name: Build Soccer Board

# ====================================================================================
# The soccer equivalent of pull-slate.yml, and it works the same way:
#   MANUAL INPUTS ARE COMMITTED, EVERYTHING ELSE IS AUTOMATED.
#
# Baseball commits cards/lineups by hand because Kasper is auth-walled and RotoWire is a page,
# then the Action fetches odds and weather, scores, drafts, injects and commits. Soccer is the
# same shape with a different split, forced by what a runner can actually reach:
#
#   BROWSER-SCRAPED, committed once per slate  ->  soccer/slates/<date>/
#       ags.psv        oddschecker anytime-goalscorer prices   (bot-protected)
#       xg.psv         understat playersData, both seasons     (Cloudflare serves a shell to
#                                                               the runner -- probed 2026-08-24)
#       fixtures.json  home/away/kickoff/league/espn per match
#
#   FETCHED HERE                              ->  ESPN team sheets
#       The runner CAN reach ESPN -- that is how soccer_settle.js has been settling nights
#       unattended since 08-26 -- and team news is the one input that CHANGES during the day.
#       So it is the one input worth automating, and the reason this workflow exists at all.
#
# SLATE DATE = the newest committed soccer/slates/<date>/ags.psv, exactly as baseball takes it
# from the newest committed cards_<date>.json. Commit a new slate directory and the board rolls
# onto it; commit nothing and it holds.
#
# ⚠️ A SAME-SLATE REBUILD NEVER RE-DRAFTS. It runs soccer_rebuild_cli.js, which re-runs the very
# function the browser runs (SoccerDraft.redraft) against the PRIOR board: CONFLOCK freezes
# anything confirmed or underway, MINTGUARD forbids minting past a slip's own kickoff, and open
# slips are repaired leg by leg. This is regen15.py's rule -- "a same-slate rebuild ALWAYS
# preserves the prior draft ... so a live, confirmed board is never re-drafted out from under a
# placed bet" -- and it is the whole reason a cron is safe here. A fresh draft every pass would
# chase the afternoon's price drift and quietly move a slip somebody backed.
#
# ⚠️ IT DOES NOT GRADE. soccer-settle.yml owns the ledger, and the board's baked meta.season is
# deliberately the ledger EXCLUDING tonight. Rebuilding a board with a post-fold ledger makes
# every ticket count twice.

on:
  # DISPATCHFALLBACK-2026-08-27. The cron below has NEVER fired -- one run in this workflow's
  # life, and that was a manual dispatch. Five and a half hours, ~20 missed slots. Meanwhile
  # pull-slate.yml's own `*/5` schedule fires all day in this same repo, so it is not that the
  # scheduler is off; this workflow specifically is not being picked up. Rather than keep waiting
  # to find out why, listen for the dispatches that DEMONSTRABLY arrive: pull-slate.yml posts
  # `tick` on every external build-board, and ticker.yml fans `build-tick` every five minutes for
  # ~25 after it. The concurrency group below collapses the pile-up and the commit gate makes a
  # no-op pass free, so extra triggers cost nothing.
  # ⚠️ THIS ONLY COVERS THE EVENING. That dispatch chain runs 16:00-05:59Z because it exists for
  # baseball. An 11:00Z Saturday kickoff still depends on the cron nobody has seen work -- so this
  # is a floor under the evening slates, not a fix for the schedule.
  repository_dispatch:
    types: [tick, build-tick, build-board, build-soccer]
  schedule:
    # Every 15 minutes across the afternoon and evening a European slate lives in. The commit
    # gate makes a no-op pass free, and the point of the density is the hour before each kickoff
    # when the XI lands -- that is the only window where a rebuild changes anything.
    - cron: '*/15 9-23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and report, but commit nothing."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: soccer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 🚨 DEPLOYTOKEN-2026-08-31 -- THE BOARD WAS REACHING THE REPO AND NOT THE SITE.
      # A push made with the default GITHUB_TOKEN does not trigger any further workflow run.
      # This job's Publish step commits soccer/index.html and soccer/soccer_D.json, both of
      # which are in deploy-pages.yml's `paths:` -- and NONE of those commits has ever started
      # a deploy. The soccer board only ever went live when some OTHER commit did: an MLB
      # index.html change from pull-slate.yml, which checks out with `secrets.GH_PAT ||
      # github.token` and therefore DOES trigger downstream workflows.
      # PIPELINE open item 8 closed on exactly that coincidence -- "every soccer-settle hour
      # sits inside pull-slate's window, where MAX_STALE_MIN = 25 guarantees an index.html
      # commit, and therefore a deploy, within 25 minutes". That is true only while baseball is
      # still building. On 2026-08-31 the MLB slate was finished and frozen by 03:00Z, its
      # auto-builds were touching nothing but slate_auto_<date>.json, and the 14:08Z soccer
      # board sat committed and undeployed until it was pushed out by a hand dispatch. Every
      # team-news repair for the rest of that slate would have done the same.
      # Same pattern as pull-slate.yml, falling back to github.token when no PAT is set: the
      # push still works without one, it just does not deploy -- which is today's behaviour.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------------------------------
      # Which slate, and is it still open? A night the settle workflow has already folded is
      # FINISHED -- rebuilding it would re-bake a board whose meta.season now includes itself.
      # ------------------------------------------------------------------------------------
      - name: Resolve the slate
        id: slate
        run: |
          cd soccer
          DATE=$(ls -1d slates/*/ 2>/dev/null | sed 's#slates/##;s#/##' | sort | tail -1)
          if [ -z "$DATE" ]; then echo "no slate directories"; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          for f in ags.psv xg.psv fixtures.json; do
            [ -f "slates/$DATE/$f" ] || { echo "::error::slates/$DATE/$f missing"; exit 1; }
          done
          if python3 -c "import json,sys;s=json.load(open('soccer_season.json'));sys.exit(0 if '$DATE' in s.get('graded_nights',[]) else 1)"; then
            echo "$DATE is already folded into the ledger -- board is finished"
            echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "slate $DATE"
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "go=true"    >> $GITHUB_OUTPUT
          fi

      - name: Stage the work directory
        if: steps.slate.outputs.go == 'true'
        run: |
          cd soccer
          rm -rf .work && mkdir -p .work
          cp slates/${{ steps.slate.outputs.date }}/{ags.psv,xg.psv,fixtures.json} .work/
          # PRICELEDGER-SOCCER-2026-09-04. The committed per-slate price ledger. A price is
          # INSERTED once and never updated, and this file is what makes that survive a build.
          # Absent on the first build of a slate -- soccer_mock.py creates it -- so the copy is
          # allowed to fail.
          cp slates/${{ steps.slate.outputs.date }}/prices.json .work/ 2>/dev/null || true
          # squads.psv is SQUADCLUB-2026-08-28 and is optional: slate directories committed before
          # it existed do not have one, and the payload simply falls back to the understat club.
          cp slates/${{ steps.slate.outputs.date }}/squads.psv .work/ 2>/dev/null || true
          cp soccer_*.py soccer_*.js .work/
          cp soccer_season.json .work/
          cp ../index.html .work/index_live.html
          [ -f boards/${{ steps.slate.outputs.date }}.json ] && cp boards/${{ steps.slate.outputs.date }}.json .work/prior.json || true

      # ------------------------------------------------------------------------------------
      # Team news. 20 = at least one sheet is not published yet, which is the NORMAL state for
      # most of the day and for the WHOLE gap between staggered kickoffs.
      #
      # 🚨 XIPARTIALGATE-2026-08-29. This step used to join ONLY on rc 0, on the reasoning that
      # "an XI filter applied while one sheet is missing deletes that match from the board".
      # That reasoning was made obsolete by XIPARTIAL-2026-08-28 and never revisited here, so the
      # per-match fix shipped that day was DEAD CODE on every real card:
      #
      #   soccer_teamnews.py   already decides `trusted` PER MATCH (xi_h == 11 and xi_a == 11)
      #                        and refuses to assert `absent` for any match whose sheet is
      #                        incomplete -- those names come back as `unplaced`, not out.
      #   soccer_rebuild_cli.js already builds `xiMatches` from that per-match trust and passes
      #                        it to SoccerDraft.redraft(), so a player in an UNPUBLISHED match
      #                        stays 'projected' and fully draftable.
      #
      # Both halves were built for exactly this input. Only this `case` kept them from ever
      # seeing it. Football XIs land about an hour before kickoff, so on a card that spans
      # 11:30Z to 19:30Z rc is 20 for essentially the entire slate and the board never applied
      # team news at all. Measured on 2026-08-29 (22 fixtures, 8 sheets published at 13:45Z):
      #
      #   rebuild @13:10Z, no teamnews   -> "Outside the Box" = Schick / Burkardt / BETO  (a sub)
      #   rebuild @13:10Z, this change   -> Beto dropped, moon repaired to
      #                                     Guirassy / Schick / Burkardt          rc 0, CHANGED
      #
      # Beto was named on Everton's bench at ~13:00Z and rode a live moon to kickoff because
      # this gate ate the half-hour window in which the slip was still repairable.
      #
      # 30 still drafts without team news: no feed at all is a different fact from a partial one.
      # ------------------------------------------------------------------------------------
      - name: Pull ESPN team sheets
        id: tn
        if: steps.slate.outputs.go == 'true'
        run: |
          cd soccer/.work
          set +e
          node soccer_teamnews_fetch.js fixtures.json teamnews.psv
          RC=$?
          set -e
          echo "rc=$RC" >> $GITHUB_OUTPUT
          case $RC in
            0)  echo "every sheet published -- joining to the priced field"
                python3 soccer_teamnews.py ags.psv teamnews.psv teamnews.json ;;
            20) echo "::notice::Some sheets not published yet; joining the ones that ARE (per-match trust)."
                python3 soccer_teamnews.py ags.psv teamnews.psv teamnews.json
                # ⚠️ NOT PEDANTRY. Before the first sheet of the day lands, rc is ALSO 20 and the
                # join classifies nobody. soccer_rebuild_cli.js exits 3 on an empty `xi` -- on
                # purpose, because an empty XI gates the pool to nothing and mints an empty board
                # -- and the draft step below treats any rc other than 0/10 as a build failure.
                # "No sheet has published" is the same fact as "no team news", so drop the file
                # and let the rebuild run unfiltered, exactly as it did before this change.
                if ! python3 -c "import json,sys;sys.exit(0 if json.load(open('teamnews.json')).get('xi') else 1)"; then
                  echo "::notice::No sheet has published yet -- dropping the empty join."
                  rm -f teamnews.json
                fi ;;
            30) echo "::warning::ESPN unreachable this pass; drafting without team news." ;;
            *)  echo "::error::soccer_teamnews_fetch.js exited $RC"; exit $RC ;;
          esac

      # ------------------------------------------------------------------------------------
      # Score, then draft. soccer_mock.py writes scored.json and a FRESH tickets.json; if a
      # prior board exists for this slate that fresh draft is thrown away and replaced by the
      # preserving re-draft. Exit 10 from the rebuild means nothing moved.
      # ------------------------------------------------------------------------------------
      - name: Score and draft
        id: draft
        if: steps.slate.outputs.go == 'true'
        run: |
          cd soccer/.work
          python3 soccer_mock.py
          if [ -f prior.json ]; then
            # OCTAL-2026-08-28. `date -u +%H` prints a LEADING ZERO, and bash arithmetic reads a
            # leading-zero literal as OCTAL -- so 08 and 09 are not numbers and the step died with
            # "value too great for base (error token is \"08\")". 00-07 parse fine as octal, 10+ has
            # no zero, so the ONLY casualties were the hours 08 and 09 -- and this build ran green
            # every other hour of the day, which is why it went unnoticed. Measured 2026-08-28:
            # 29 consecutive failures, 08:00Z through 09:55Z, green again at 10:00Z. That window is
            # 4:00-5:59 AM ET, i.e. the first hour of the morning cover the owner asked for.
            # 10# forces base ten.
            # 🚨 SLATECLOCK-2026-08-31 -- `--now` IS GONE, DELIBERATELY. This computed wall-clock
            # UTC minutes (0..1439) and handed them to a comparison against `kickoff`, which is
            # minutes past midnight UTC OF THE SLATE DATE and legally exceeds 1440 (MLS kicks off
            # 00:30Z = 1470). Two bases, one comparison, so MINTGUARD could not tell "before the
            # match" from "during it" for any late kickoff -- and after midnight it read every
            # FINISHED match on the current slate as unstarted, which measured as six new slips
            # minted into completed games on the 2026-08-31 board. soccer_rebuild_cli.js now
            # derives the clock from the prior board's own meta.date. Do not reintroduce this
            # line; if you need to pin the clock, pass a SLATE-RELATIVE --now.
            # (The OCTAL-2026-08-28 note below is kept: it is why `10#` was here at all.)
            set +e
            node soccer_rebuild_cli.js prior.json scored.json tickets.json \
                 $([ -f teamnews.json ] && echo "--teamnews teamnews.json")
            RC=$?
            set -e
            echo "rebuild_rc=$RC" >> $GITHUB_OUTPUT
            if [ $RC -ne 0 ] && [ $RC -ne 10 ]; then echo "::error::rebuild exited $RC"; exit $RC; fi
            # 🚨 RCTRAP-2026-08-29. This WAS `[ $RC -eq 10 ] && echo "draft unchanged"`, and that
            # is the last command of the script, so the STEP inherits its status. When RC is 10
            # (nothing moved) the test passes and the step exits 0 -- but when RC is 0, i.e. THE
            # DRAFT ACTUALLY CHANGED THE BOARD, the test is false, the AND-list returns 1, and the
            # step fails before Payload / Publish ever run. A landmine that fires only on the
            # passes that matter: every quiet pass is RC 10 and green, so it sat unnoticed until
            # 2026-08-29, when the first genuinely changed redraft of the day (6 locked, 3
            # repaired, 3 new, 2 demoted -- the pass that took four out-of-squad men off live
            # moons) wrote its tickets.json and then threw the whole build away.
            #     $ bash -e -c 'RC=0;  [ $RC -eq 10 ] && echo x'; echo $?   -> 1
            #     $ bash -e -c 'RC=10; [ $RC -eq 10 ] && echo x'; echo $?   -> 0
            # An `if` has no status to leak. Never end a step on a bare `&&`.
            if [ $RC -eq 10 ]; then echo "draft unchanged"; fi
          else
            echo "first build of this slate -- the fresh draft stands"
            echo "rebuild_rc=0" >> $GITHUB_OUTPUT
          fi

      - name: Payload and fork
        if: steps.slate.outputs.go == 'true'
        run: |
          cd soccer/.work
          python3 soccer_payload.py scored.json tickets.json xg.psv soccer_D.json \
                  ${{ steps.slate.outputs.date }} --season soccer_season.json \
                  $([ -f teamnews.json ] && echo "--teamnews teamnews.json") \
                  $([ -f squads.psv ] && echo "--squads squads.psv")
          python3 soccer_fork.py index_live.html soccer_D.json soccer_index.html

      # ------------------------------------------------------------------------------------
      # THE COMMIT GATE. index.html changes on every build because the payload carries a build
      # stamp and the MLB board underneath it moves every few minutes -- so "the file differs"
      # is not "the board moved". Gate on the DRAFT and the PLAYERS, which is what a reader
      # would notice, exactly as commit_gate.py does on the baseball side.
      # ------------------------------------------------------------------------------------
      - name: Did anything a reader would notice change?
        id: gate
        if: steps.slate.outputs.go == 'true'
        run: |
          cd soccer/.work
          if [ ! -f prior.json ]; then echo "first build"; echo "commit=true" >> $GITHUB_OUTPUT; exit 0; fi
          # 🚨 GATEOUT-2026-08-29. This block used to be redirected straight into $GITHUB_OUTPUT
          # (`python3 - <<'PY' >> $GITHUB_OUTPUT`), so EVERY line python printed was parsed as a
          # `key=value` output. `commit=...` is fine. `::notice::the draft moved` is not, and the
          # runner answers "Invalid format '::notice::the draft moved'" / "Unable to process file
          # command 'output' successfully" and FAILS THE STEP.
          # That notice prints on exactly one condition -- `a[0] != b[0]`, THE TICKETS CHANGED --
          # so like RCTRAP above it was armed only on the passes that matter and slept through
          # every quiet one. Found 2026-08-29 the moment RCTRAP was fixed and a genuinely changed
          # redraft reached this step for the first time: two landmines in series, both hiding
          # behind "the draft did not move today".
          # Workflow annotations belong on STDOUT. $GITHUB_OUTPUT takes key=value and nothing else.
          python3 - <<'PY' > gate.txt
          import json
          def sig(p):
              d = json.load(open(p))
              t = sorted(x['kind'] + ':' + '+'.join(l['name'] for l in x['players']) for x in d['tickets'])
              pl = {n: (v.get('odds'), v.get('status'), bool(v.get('out')), bool(v.get('hr')))
                    for n, v in d['players'].items()}
              return t, pl
          a, b = sig('prior.json'), sig('soccer_D.json')
          print('commit=' + ('true' if a != b else 'false'))
          if a[0] != b[0]: print('::notice::the draft moved')
          PY
          grep '^commit=' gate.txt >> "$GITHUB_OUTPUT"
          grep '^::' gate.txt || true
          echo "gate: $(grep '^commit=' gate.txt | tail -1)"

      - name: Publish
        if: steps.slate.outputs.go == 'true' && steps.gate.outputs.commit == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          cd soccer
          D=${{ steps.slate.outputs.date }}
          cp .work/soccer_index.html index.html
          cp .work/soccer_D.json     soccer_D.json
          mkdir -p boards && cp .work/soccer_D.json "boards/$D.json"
          # PRICELEDGER-SOCCER-2026-09-04 -- the ledger goes back beside the slate it prices.
          mkdir -p "slates/$D" && cp .work/prices.json "slates/$D/prices.json"
          cd ..
          git config user.name  "kasper-bot"
          git config user.email "kasper-bot@users.noreply.github.com"
          git add soccer/index.html soccer/soccer_D.json soccer/boards/ \
                  "soccer/slates/$D/prices.json"
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Soccer board $D ($(date -u +%H:%MZ))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { echo "pushed"; exit 0; }
              sleep 5
            done
            echo "::error::could not push after 3 attempts"; exit 1
          fi

      - name: Report
        if: always() && steps.slate.outputs.go == 'true'
        run: |
          echo "slate    ${{ steps.slate.outputs.date }}"
          echo "teamnews rc=${{ steps.tn.outputs.rc }}  (0 complete / 20 not yet / 30 no feed)"
          echo "rebuild  rc=${{ steps.draft.outputs.rebuild_rc }}  (10 = draft unchanged)"
          echo "commit   ${{ steps.gate.outputs.commit }}${{ github.event.inputs.dry_run == 'true' && '  (DRY RUN -- nothing published)' || '' }}"
