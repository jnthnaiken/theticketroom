.frame{position:absolute;inset:28px;border:1px solid #b69dff33;border-radius:28px}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;gap:60px;align-items:center;padding:0 110px}
.eyebrow{font-family:RM;font-size:21px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.hoop{width:96px;height:96px;border-radius:50%;margin:28px 0 22px;display:grid;place-items:center;border:2px solid #b69dff55;
 background:radial-gradient(circle at 50% 40%,#b69dff22,#0e1219);box-shadow:0 0 80px -10px #b69dff66;font-size:46px}
h1{font-family:Oswald;font-weight:700;font-size:150px;line-height:.95;text-transform:uppercase;
 background:linear-gradient(90deg,#e3d8ff,#b69dff 50%,#ff5d8f);-webkit-background-clip:text;color:transparent}
.sub{font-family:Oswald;font-weight:500;font-size:40px;letter-spacing:.04em;text-transform:uppercase;margin-top:14px;color:var(--mut)}
.sub b{color:var(--txt)}
.card{border:1px solid #b69dff55;border-radius:22px;padding:30px 36px;background:linear-gradient(180deg,#171428,#0e1219);box-shadow:0 30px 70px -40px #b69dff}
.k{font-family:RM;font-size:19px;letter-spacing:.24em;color:var(--violet);text-transform:uppercase}
.g{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line2);padding:18px 0}
.g:first-of-type{border-top:0}
.g .t{font-family:Oswald;font-size:40px;font-weight:600;letter-spacing:.02em}
.g .t span{color:var(--dim);font-weight:500;margin:0 10px}
.g .w{font-family:RM;font-size:24px;color:var(--mut)}
.pick{margin-top:8px;border-top:1px dashed var(--line2);padding-top:22px;display:flex;justify-content:space-between;align-items:center}
.pick .lbl{font-family:RM;font-size:19px;letter-spacing:.2em;color:var(--pink);text-transform:uppercase}
.pick .nm{margin-top:8px;height:34px;width:300px;border-radius:8px;background:repeating-linear-gradient(90deg,#2f3b52 0 14px,#262f42 14px 28px);filter:blur(1.5px)}
.pick .o{font-family:Oswald;font-size:64px;font-weight:700;color:var(--pink)}
.foot{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-family:RM;font-size:19px;letter-spacing:.2em;color:var(--dim)}
